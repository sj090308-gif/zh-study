<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}button,.choice,.face.tap{touch-action:manipulation;-webkit-tap-highlight-color:transparent}</style>

<body>
<style>
/* Layout: 왼쪽은 범위 고르는 여백, 오른쪽은 단어를 크게 보여 주는 연습장 한 장 */
:root{
--bg:#e9f0ea;--sheet:#fcfdf9;--ink:#16302a;--mute:#566c64;--line:#c3d3ca;--grid:#d9897a;--accent:#0d6655;--on-accent:#fff;--soft:#d9e8df;
--ok:#167043;--ok-bg:#d9f0e1;--bad:#b3261e;--bad-bg:#fae0dc;
--t1:#c0241b;--t2:#a85f00;--t3:#157238;--t4:#2650bd;
--han:"Songti SC","Noto Serif SC","STSong","SimSun",serif;--ko:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;--title:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0f1e1a;--sheet:#172a25;--ink:#e6f1ec;--mute:#a0b6ad;--line:#2f4a42;--grid:#90574b;--accent:#5fd0b5;--on-accent:#08231c;--soft:#223a33;
--ok:#6fdc9e;--ok-bg:#183c2a;--bad:#ff9d93;--bad-bg:#4a2320;
--t1:#ff8f85;--t2:#f2b75c;--t3:#74d897;--t4:#93b2ff;color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#0f1e1a;--sheet:#172a25;--ink:#e6f1ec;--mute:#a0b6ad;--line:#2f4a42;--grid:#90574b;--accent:#5fd0b5;--on-accent:#08231c;--soft:#223a33;
--ok:#6fdc9e;--ok-bg:#183c2a;--bad:#ff9d93;--bad-bg:#4a2320;
--t1:#ff8f85;--t2:#f2b75c;--t3:#74d897;--t4:#93b2ff;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ko);font-size:16px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:270px minmax(0,1fr);gap:32px;align-items:start}
h1{font-family:var(--title);font-size:27px;line-height:1.25;margin:0;text-wrap:balance}
.side{display:grid;gap:20px;min-width:0}
.group{display:grid;gap:8px}
.lbl{font-size:13px;font-weight:600;color:var(--mute)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:transparent}
.set .box{width:16px;height:16px;border:1.5px solid var(--mute);border-radius:2px;display:grid;place-items:center;font-size:12px;line-height:1;color:var(--on-accent)}
.set[aria-pressed="true"]{background:var(--sheet);border-color:var(--accent)}
.set[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.set small{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:3px;overflow:hidden;width:fit-content;max-width:100%}
.seg button{padding:6px 12px;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.foot{font-size:12.5px;color:var(--mute);display:grid;gap:4px}
.link{font-size:12.5px;color:var(--mute);text-decoration:underline;padding:0;justify-self:start}
.main{display:grid;gap:12px;min-width:0}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:2px solid var(--ink)}
.tabs button{padding:9px 16px;font-weight:500;color:var(--mute);border-radius:3px 3px 0 0}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.dir{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;min-height:36px}
.dir .opt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sheet{background:var(--sheet);border:1px solid var(--line);padding:clamp(16px,3.5vw,32px);min-height:430px;display:flex;flex-direction:column;gap:20px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--line);margin-top:-12px}.bar i{display:block;height:100%;background:var(--accent)}
.say{border:1px solid var(--line);border-radius:3px;padding:4px 10px;font-size:13px;color:var(--ink)}
.face{display:flex;flex-direction:column;gap:16px;flex:1;justify-content:center;align-items:center;text-align:center;min-width:0}
.face.tap{cursor:pointer}
.word{font-family:var(--han);font-weight:500;font-size:clamp(56px,11vw,88px);line-height:1.2;letter-spacing:.04em}
.sent{font-family:var(--han);font-weight:500;font-size:clamp(25px,4.6vw,38px);line-height:1.45;text-wrap:balance}
.py{font-family:var(--han);font-size:clamp(23px,4vw,32px);line-height:1.35;overflow-wrap:anywhere}
.mean{font-size:clamp(20px,3.2vw,26px);font-weight:500;line-height:1.4;text-wrap:balance}
.face .sent.sm,.face .py.sm,.face .mean.sm{font-size:clamp(18px,2.6vw,22px)}
.veil{border:1px dashed var(--line);color:var(--mute);font-size:14px;padding:9px 26px;border-radius:3px;min-width:120px}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{padding:11px 22px;border:1px solid var(--line);border-radius:3px;font-weight:600;min-width:128px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.good{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.btn.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btn.mini{min-width:0;font-weight:500;padding:11px 14px;color:var(--mute)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice{display:flex;gap:10px;align-items:center;justify-content:center;text-align:center;padding:13px 12px;min-height:66px;border:1px solid var(--line);border-radius:3px;min-width:0;overflow-wrap:anywhere}
.choice .h{font-family:var(--han);font-size:clamp(19px,3vw,25px)}.choice .p{font-family:var(--han);font-size:clamp(17px,2.4vw,20px)}.choice .m{font-size:16px}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:disabled{cursor:default;color:inherit}
.choice.right{background:var(--ok-bg);border-color:var(--ok)}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad)}
.ans{display:grid;gap:4px;text-align:center;border-top:1px dashed var(--line);padding-top:12px}
.ans b{font-family:var(--han);font-weight:500;font-size:22px}
.write{display:flex;gap:8px;width:100%;max-width:560px;margin:0 auto}
.write input{flex:1;min-width:0;font:inherit;font-size:19px;padding:11px 12px;background:transparent;color:var(--ink);border:1.5px solid var(--mute);border-radius:3px}
.hint{font-size:13px;color:var(--mute);text-align:center}
.verdict{font-weight:600;text-align:center}.verdict.good{color:var(--ok)}.verdict.no{color:var(--bad)}
.score{font-family:var(--title);font-size:48px;line-height:1.1;text-align:center;font-variant-numeric:tabular-nums}
.missed{display:grid;gap:0;width:100%;max-width:560px;text-align:left}
.missed div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.missed .h{font-family:var(--han);font-size:17px}
.search{font:inherit;padding:8px 10px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:3px;width:100%}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:13px;color:var(--mute);text-align:left;padding:6px 8px;border-bottom:2px solid var(--ink)}
th button{font-weight:600;text-decoration:underline dotted}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.h{font-family:var(--han);font-size:20px;line-height:1.35}td.p{font-family:var(--han);font-size:16.5px}td.m{font-size:15px}
td.cov{cursor:pointer;color:transparent;background:var(--soft)}td.cov *{color:transparent}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.dot.ok{background:var(--ok);border-color:var(--ok)}.dot.no{background:var(--bad);border-color:var(--bad)}
.play{padding:3px 6px;color:var(--accent);font-size:13px}
.chunks{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.chunk{display:grid;gap:1px;justify-items:center;padding:6px 4px;border:1px solid var(--line);border-radius:3px;font-size:14px;font-variant-numeric:tabular-nums}
.chunk small{font-size:11.5px;color:var(--mute)}
.chunk[aria-pressed="true"]{background:var(--sheet);border-color:var(--accent);font-weight:600}
.chunk.done small{color:var(--ok)}
.empty{margin:auto;text-align:center;color:var(--mute);max-width:36ch}
@media (max-width:780px){.wrap{grid-template-columns:minmax(0,1fr);gap:18px;padding-block:18px 36px}.side{gap:12px}.sets{grid-template-columns:repeat(2,minmax(0,1fr))}.set{padding:7px 8px;font-size:14px}.set .note{display:none}.rowopts{display:flex;flex-wrap:wrap;gap:12px}.sheet{min-height:400px}.tabs button{padding:8px 12px}}
@media (max-width:420px){.opts{grid-template-columns:minmax(0,1fr)}.choice{min-height:54px}.missed div{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.missed div span:last-child{grid-column:1/-1;color:var(--mute)}}
</style>

function renderDone(){const n=run.deck.length,ok=run.deck.filter((_,i)=>run.res[i]===true).length,miss=run.deck.filter((_,i)=>run.res[i]===false);
 $("stage").innerHTML=`<div class="face"><div class="lbl">한 바퀴 끝</div><div class="score">${ok} / ${n}</div>${miss.length?`<div class="missed">${miss.slice(0,40).map(it=>`<div><span class="h" lang="zh-Hans">${hasHan(it)?esc(it.h):"–"}</span><span>${tone(it.p)}</span><span>${esc(it.m)}</span></div>`).join("")}</div>`:`<p>전부 맞혔습니다.</p>`}</div><div class="acts">${miss.length?`<button class="btn pri" data-a="again-miss">틀린 ${miss.length}개 다시</button>`:""}${S.chunk<chunks().length-1?`<button class="btn pri" data-a="nextchunk">다음 구간</button>`:""}<button class="btn" data-a="again">처음부터</button></div>`}
const hideC=rd(LS+":h",{h:false,p:false,m:false});
function renderList(){const st=$("stage"),base=selected();
 st.innerHTML=`<div class="top"><span id="cnt"></span><span>제목을 누르면 그 열을 가립니다. 가린 칸은 누르면 보입니다.</span></div><div class="tw"><table><thead><tr><th></th>${["h","p","m"].map(f=>`<th><button data-a="col" data-f="${f}">${F[f]}${hideC[f]?" (가림)":""}</button></th>`).join("")}</tr></thead><tbody id="tb"></tbody></table></div>`;
 const strip=s=>parsePy(s).L;
 const draw=()=>{const q=($("q").value||"").trim().toLowerCase();const qp=q.replace(/[^a-zü]/g,"");const l=base.filter(it=>!q||it.h.includes(q)||it.m.includes(q)||(qp&&strip(it.p).includes(qp)));$("cnt").textContent=l.length+"개";
  $("tb").innerHTML=l.map(it=>{const s=status(it);return`<tr><td style="white-space:nowrap"><span class="dot ${s===1?"ok":s===0?"no":""}" title="${s===1?"외움":s===0?"틀림":"아직 안 풂"}"></span><button class="play" data-a="sayh" data-t="${esc(it.h)}" aria-label="듣기">▶</button></td><td class="h ${hideC.h?"cov":""}" lang="zh-Hans">${hasHan(it)?esc(it.h):"–"}</td><td class="p ${hideC.p?"cov":""}">${tone(it.p)}</td><td class="m ${hideC.m?"cov":""}">${esc(it.m)}</td></tr>`}).join("")||`<tr><td colspan="4" class="m">찾는 단어가 없습니다.</td></tr>`};
 $("q").oninput=draw;draw();
}
$("stage").onclick=e=>{const c=e.target.closest("td.cov");if(c){c.classList.remove("cov");return}
 const b=e.target.closest("[data-a]");if(!b||run===undefined)return;const a=b.dataset.a,it=run.deck[run.i];
 if(a==="nohan"){S.front="p";S.ask="p";S.ans="m";S.wfront="m";wr(LS+":s",S);renderSide();start();return}
 if(a==="say")say(it.h);
 if(a==="sayh")say(b.dataset.t);
 if(a==="col"){hideC[b.dataset.f]=!hideC[b.dataset.f];wr(LS+":h",hideC);renderList()}
 if(a==="flip"&&!run.shown){run.shown=true;render()}
 if(a==="prev"&&run.i>0){run.i--;run.shown=false;render()}
 if(a==="yes"||a==="no"){const ok=a==="yes";run.res[run.i]=ok;mark(it,ok);next()}
 if(a==="pick"&&run.pick===null){const i=+b.dataset.i;run.pick=i;const ok=run.opts[i].key===it.key;run.res[run.i]=ok;mark(it,ok);render()}
 if(a==="next")next();
 if(a==="again")start();
 if(a==="nextchunk"){S.chunk++;wr(LS+":s",S);renderSide();start()}
 if(a==="again-miss")start(shuffle(run.deck.filter((_,i)=>run.res[i]===false)));
};
document.addEventListener("keydown",e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;const st=$("stage");if(!run||run.i>=run.deck.length)return;
 if(S.mode==="card"){if(e.code==="Space"){e.preventDefault();if(!run.shown){run.shown=true;render()}}else if(run.shown&&e.key==="ArrowRight")st.querySelector('[data-a="yes"]')?.click();else if(run.shown&&e.key==="ArrowLeft")st.querySelector('[data-a="no"]')?.click()}
 if(S.mode==="quiz"&&run.pick===null&&/^[1-4]$/.test(e.key))st.querySelectorAll(".choice")[+e.key-1]?.click();
});
renderSide();start();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
